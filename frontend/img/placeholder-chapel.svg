<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo profundo azul catedral -->
  <rect width="1200" height="500" fill="#0A1626" />
  
  <!-- Patrón de ventanales ojivales góticos / eclesiales estilizados -->
  <g opacity="0.15" stroke="#F1B434" stroke-width="1.5">
    <!-- Ventanal Central -->
    <path d="M600 80 C550 180 540 450 540 450 L660 450 C660 450 650 180 600 80 Z" />
    <path d="M600 130 C565 210 560 450 560 450 L640 450 C640 450 635 210 600 130 Z" opacity="0.7" />
    
    <!-- Ventanal Izquierdo -->
    <path d="M460 140 C420 220 410 450 410 450 L510 450 C510 450 500 220 460 140 Z" />
    
    <!-- Ventanal Derecho -->
    <path d="M740 140 C700 220 690 450 690 450 L790 450 C790 450 780 220 740 140 Z" />
  </g>
  
  <!-- Luz del sol filtrada en tonos dorados cálidos -->
  <g opacity="0.25">
    <polygon points="600,80 400,500 800,500" fill="url(#sunlight-grad-1)" />
    <polygon points="460,140 250,500 670,500" fill="url(#sunlight-grad-2)" />
    <polygon points="740,140 530,500 950,500" fill="url(#sunlight-grad-2)" />
  </g>

  <!-- Definiciones de Gradientes -->
  <defs>
    <radialGradient id="sunlight-grad-1" cx="50%" cy="16%" r="70%">
      <stop offset="0%" stop-color="#F1B434" stop-opacity="1" />
      <stop offset="60%" stop-color="#F1B434" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F1B434" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sunlight-grad-2" cx="50%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#F1B434" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F1B434" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Leyenda informativa para desarrollo (oculta o de contraste sutil) -->
  <text x="600" y="475" font-family="'Inter', sans-serif" font-size="11" fill="#F1B434" opacity="0.3" text-anchor="middle" letter-spacing="1">
    Fondo Sugerido: Ventanales de Capilla / Silueta Comunitaria (1200x500)
  </text>
</svg>
