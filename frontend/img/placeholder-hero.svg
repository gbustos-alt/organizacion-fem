  </text>
  <text x="400" y="495" font-family="'Inter', sans-serif" font-size="12" fill="#888B8D" text-anchor="middle" letter-spacing="1">
    PROTAGONISTA Y CÁLIDA (800x600)
  </text>
</svg>
