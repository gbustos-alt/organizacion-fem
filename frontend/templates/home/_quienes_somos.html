{% if quienes_somos and quienes_somos.activo %}
<section class="home-identity-section" id="quienes-somos" style="padding: 7.5rem 0; background-color: var(--color-bg); position: relative; overflow: visible;">
    <div class="container" style="max-width: var(--container-max-width); margin: 0 auto; padding: 0 var(--space-md); display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 0; align-items: center; position: relative; z-index: 12;" class="d-grid-mobile-1">
        
        <!-- Columna izquierda: Imagen con contenedor e hilo estilizado -->
        <div class="identity-visual-block" style="position: relative; z-index: 1; padding-right: var(--space-xxl);">
            <div class="identity-image-wrapper" style="border: 6px solid var(--color-white); border-radius: 140px 30px 140px 30px; box-shadow: var(--shadow-premium); overflow: hidden; background-color: var(--color-white);">
                <img src="{{ quienes_somos.imagen_url or url_for('static', path='img/fotos prueba/escuela.jpeg') }}" 
                     alt="Fundación FEM - Acompañamiento y Misión" 
                     class="identity-img" style="width: 100%; height: 450px; object-fit: cover; display: block;">
            </div>
        </div>

        <!-- Columna derecha: Tarjeta superpuesta (Card de Contenido) -->
        <div class="identity-text-block" style="background-color: var(--color-bg-alt); border: 1px solid var(--color-border); border-left: 4px solid var(--color-pantone-yellow-raw); border-radius: var(--radius-md); padding: var(--space-xl); box-shadow: var(--shadow-premium); position: relative; z-index: 2; margin-left: -120px; margin-top: var(--space-xl); transition: var(--transition-smooth);" class="about-card-mobile">
            <span class="eyebrow" style="color: var(--color-pantone-yellow-raw); margin-bottom: var(--space-xs); display: block; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; font-size: 0.85rem;">
                Nuestra Identidad
            </span>
            <h2 style="font-family: var(--font-display); font-size: 2.2rem; color: var(--color-primary); margin-top: 0; margin-bottom: var(--space-md); font-weight: 700; line-height: 1.15;">
                {{ quienes_somos.titulo }}
            </h2>
            <p style="font-family: var(--font-sans); font-size: 1.05rem; line-height: 1.6; color: var(--color-text); margin-top: 0; margin-bottom: var(--space-lg); white-space: pre-line;">
                {{ quienes_somos.descripcion }}
            </p>
            <div style="display: flex; justify-content: flex-start;">
                <a href="/mision" class="btn btn-primary">
                    Conoce nuestra misión
                </a>
            </div>
        </div>
        
    </div>
</section>

<!-- Reglas responsivas inline específicas para asegurar la superposición y colapso móvil -->
<style>
    @media (max-width: 991px) {
        .home-identity-section .container {
            grid-template-columns: 1fr !important;
            gap: var(--space-xl) !important;
            text-align: center !important;
        }
        .home-identity-section .identity-visual-block {
            padding-right: 0 !important;
            display: flex !important;
            justify-content: center !important;
        }
        .home-identity-section .identity-image-wrapper {
            border-radius: 50% !important;
            width: 220px !important;
            height: 220px !important;
            border: 4px solid var(--color-pantone-yellow-raw) !important;
        }
        .home-identity-section .identity-img {
            height: 100% !important;
        }
        .home-identity-section .identity-text-block {
            margin-left: 0 !important;
            margin-top: 0 !important;
            text-align: left !important;
            display: block !important;
        }
    }
</style>
{% endif %}
